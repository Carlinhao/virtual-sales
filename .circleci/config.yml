version: 2.1

jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - run:
          name: "Install SSH and Git"
          command: |
            apt-get update
            apt-get install -y openssh-client git
      - checkout
      - run:
          name: "Restore dependencies"
          command: dotnet restore SalesWebMvc/SalesWebMvc.sln
      - run:
          name: "Build projects"
          command: dotnet build SalesWebMvc/SalesWebMvc.sln --no-restore
      - run:
          name: "Run tests"
          command: dotnet test SalesWebMvc/SalesWebMvc.sln --no-build

workflows:
  version: 2
  build-workflow:
    jobs:
      - build
